name: Shared swipe RPC PostgreSQL tests

on:
  pull_request:
    paths:
      - ".github/workflows/shared-swipe-db-tests.yml"
      - "supabase/migrations/20261022132848_shared_swipe_matches.sql"
      - "supabase/migrations/20261024094338_allow_self_only_swipe_upsert_key_columns.sql"
      - "supabase/migrations/20261024130000_shared_swipe_matches_yes_only.sql"
      - "supabase/migrations/20261024170000_shared_general_deck_complete.sql"
      - "supabase/migrations/20261025150000_understanding_card_state.sql"
      - "supabase/migrations/20261026130000_shared_swipe_general_a_only.sql"
      - "supabase/migrations/20261027140902_private_swipe_importance.sql"
      - "supabase/migrations/20261027195833_shared_swipe_priorities.sql"
      - "supabase/migrations/20261028180000_shared_understanding_cards.sql"
      - "supabase/tests/shared_swipe_matches.sql"
      - "supabase/tests/swipe_importance.sql"
      - "supabase/tests/shared_swipe_priorities.sql"
      - "supabase/tests/shared_understanding_cards.sql"
      - "supabase/tests/fixtures/shared_swipe_contract_schema.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swipe-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pgTAP in disposable PostgreSQL
        run: |
          docker exec -u root "${{ job.services.postgres.id }}" bash -lc \
            'apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-17-pgtap'
      - name: Set up synthetic schema and RLS
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -X -q \
            < supabase/tests/fixtures/shared_swipe_contract_schema.sql
      - name: Apply actual shared swipe migration
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -X -q \
            < supabase/migrations/20261022132848_shared_swipe_matches.sql
      - name: Apply PostgREST upsert privilege compatibility
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -X -q \
            < supabase/migrations/20261024094338_allow_self_only_swipe_upsert_key_columns.sql
      - name: Restrict shared swipe RPC to mutual YES
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -X -q \
            < supabase/migrations/20261024130000_shared_swipe_matches_yes_only.sql
      - name: Apply server-side two-member general deck unlock gate
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -X -q \
            < supabase/migrations/20261024170000_shared_general_deck_complete.sql
      - name: Apply A/B understanding-card state and revised unlock gate
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -X -q \
            < supabase/migrations/20261025150000_understanding_card_state.sql
      - name: Exclude understanding B cards from the general shared RPC
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -X -q \
            < supabase/migrations/20261026130000_shared_swipe_general_a_only.sql
      - name: Apply private swipe importance table
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -X -q \
            < supabase/migrations/20261027140902_private_swipe_importance.sql
      - name: Apply shared teen-first priority RPC
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -X -q \
            < supabase/migrations/20261027195833_shared_swipe_priorities.sql
      - name: Apply separate teen-authorised B-sharing RPC
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -X -q \
            < supabase/migrations/20261028180000_shared_understanding_cards.sql
      - name: Assert 44 real pgTAP test results
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -X -q -A -t \
            < supabase/tests/shared_swipe_matches.sql | tee /tmp/shared-swipe-test.log
          grep -qx '1..44' /tmp/shared-swipe-test.log
          if grep -Eq '^(not ok|# Looks like you failed)' /tmp/shared-swipe-test.log; then
            exit 1
          fi
          test "$(grep -Ec '^ok [0-9]+' /tmp/shared-swipe-test.log)" -eq 44
      - name: Assert 15 private importance pgTAP results
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -X -q -A -t \
            < supabase/tests/swipe_importance.sql | tee /tmp/swipe-importance-test.log
          grep -qx '1..15' /tmp/swipe-importance-test.log
          if grep -Eq '^(not ok|# Looks like you failed)' /tmp/swipe-importance-test.log; then
            exit 1
          fi
          test "$(grep -Ec '^ok [0-9]+' /tmp/swipe-importance-test.log)" -eq 15
      - name: Assert 18 shared priority pgTAP results
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -X -q -A -t \
            < supabase/tests/shared_swipe_priorities.sql | tee /tmp/shared-priority-test.log
          grep -qx '1..18' /tmp/shared-priority-test.log
          if grep -Eq '^(not ok|# Looks like you failed)' /tmp/shared-priority-test.log; then
            exit 1
          fi
          test "$(grep -Ec '^ok [0-9]+' /tmp/shared-priority-test.log)" -eq 18
      - name: Assert 20 separate B-sharing pgTAP results
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -X -q -A -t \
            < supabase/tests/shared_understanding_cards.sql | tee /tmp/shared-understanding-test.log
          grep -qx '1..20' /tmp/shared-understanding-test.log
          if grep -Eq '^(not ok|# Looks like you failed)' /tmp/shared-understanding-test.log; then
            exit 1
          fi
          test "$(grep -Ec '^ok [0-9]+' /tmp/shared-understanding-test.log)" -eq 20
