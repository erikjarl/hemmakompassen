name: UI browser smoke tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@latest
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Functional and backend contract tests
        run: node --test tests/smoke.test.cjs tests/password-auth.test.mjs tests/family-pairing.test.cjs tests/family-rls-migration.test.cjs tests/shared-swipe-migration.test.cjs tests/shared-swipe-all-a-migration.test.mjs tests/live-swipe-persistence.test.mjs tests/live-swipe-results.test.mjs tests/live-swipe-session.test.mjs tests/live-understanding-sharing.test.mjs tests/live-schyssta-list.test.mjs tests/card-catalog.test.mjs tests/understanding-skip-migration.test.mjs tests/swipe-importance.test.mjs tests/psychological-card-review.test.mjs tests/shared-swipe-priority-migration.test.mjs tests/shared-understanding-migration.test.mjs tests/schyssta-list-migration.test.mjs tests/ipip50.test.mjs tests/ipip50-ui.test.mjs
      - name: Verify static build and versioned IPIP modules
        run: npm run build && test -s dist/personality/ipip50-v1.js && test -s dist/personality/ipip50-scoring.js && test -s dist/personality/ipip50-storage.js
      - name: Browser tests and screenshots
        run: node tests/visual.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hemmakompassen-ui-screenshots
          path: artifacts/*
          if-no-files-found: ignore
          retention-days: 7
