name: Verify served GitHub Pages assets
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare public assets with this main commit
        env:
          SITE_URL: https://erikjarl.github.io/hemmakompassen
        shell: bash
        run: |
          set -euo pipefail
          # GitHub Pages may still be deploying when this push workflow starts.
          # Compare the delivered bytes, not only the Pages workflow status.
          # Pages deployment on 2026-11-09 completed after the previous 5-minute
          # check had already exhausted its attempts. Allow up to 10 minutes
          # for deployment + CDN propagation before declaring a mismatch.
          for attempt in $(seq 1 60); do
            all_match=true
            for file in index.html live-app.js ai-result-ui.js konto.html konto.js feedback.js feedback.css backend-config.js personality/ipip50-ui.js personality/ipip50-retest.js; do
              remote_file="$(mktemp)"
              if ! curl --fail --location --silent --show-error --max-time 15 \
                --header 'Cache-Control: no-cache' \
                "${SITE_URL}/${file}?verify=${GITHUB_SHA}-${attempt}" -o "${remote_file}"; then
                all_match=false
              elif ! cmp -s "${file}" "${remote_file}"; then
                echo "Attempt ${attempt}: deployed ${file} does not match commit ${GITHUB_SHA}."
                all_match=false
              fi
              rm -f "${remote_file}"
              if [ "${all_match}" != true ]; then break; fi
            done
            if [ "${all_match}" = true ]; then
              echo "Verified: all ten publicly served files match commit ${GITHUB_SHA}."
              exit 0
            fi
            if (( attempt % 6 == 0 )); then
              echo "Waiting for Pages propagation: attempt ${attempt}/60."
            fi
            sleep 10
          done
          echo "::error::GitHub Pages files did not match this commit within the 10-minute check window."
          exit 1
