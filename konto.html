<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Konto – Hemmakompassen</title><link rel="stylesheet" href="./styles.css"><style>
body{padding:24px;max-width:650px;margin:auto}main{display:grid;gap:18px;padding:20px;border:1px solid #7775;border-radius:16px}form{display:grid;gap:12px}input,select,button{font:inherit;padding:12px;border-radius:8px}input,select{border:1px solid #777}button{cursor:pointer}#status{min-height:2em;white-space:pre-wrap}section{display:grid;gap:12px}.hidden{display:none!important}a{color:inherit}
</style></head><body><p><a href="./index.html">← Till Hemmakompassen</a></p><main><h1>Ditt konto</h1><p>Här loggar du in och kopplar ihop två riktiga konton. Övriga funktioner ansluts stegvis till era konton.</p>
<section id="logged-out"><form id="email-form"><label>E-postadress <input type="email" id="email" required autocomplete="email"></label><button type="submit">Skicka inloggningslänk</button></form><p>Kontrollera din e-post och öppna länken på samma enhet. Dela inte inloggningslänken med någon annan.</p></section>
<section id="logged-in" class="hidden"><p id="account"></p><form id="name-form"><label>Visningsnamn <input id="display-name" maxlength="80" required></label><button type="submit">Spara namn</button></form><section id="unpaired"><label>Jag är <select id="role"><option value="teen">Tonåring (13–19 år)</option><option value="parent">Förälder</option></select></label><button id="create-family" type="button">Skapa familj</button><form id="accept-form"><label>Har du fått en familjekod? <input id="invite-code" minlength="36" maxlength="36" pattern="[A-Fa-f0-9]{36}" required autocomplete="off"></label><button type="submit">Anslut till familj</button></form></section><section id="paired" class="hidden"><h2>Familj</h2><p id="members"></p><button id="make-invite" type="button">Skapa ny inbjudningskod</button><p id="new-invite"></p></section><button id="logout" type="button">Logga ut</button></section><p id="status" role="status" aria-live="polite"></p></main>
<script src="./backend-config.js"></script><script type="module" src="./konto.js"></script></body></html>
