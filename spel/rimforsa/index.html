<title>Lage i Rimforsa – 16-bitarsäventyr</title>
<style>
:root{color-scheme:dark;--cream:#fff1c9;--gold:#e6c16a;--pine:#173c32}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#102b25;color:var(--cream);font-family:system-ui,-apple-system,sans-serif}
body{background:radial-gradient(ellipse at 50% 0,#2c5b48 0,#102b25 65%);padding:12px max(8px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.shell{max-width:780px;margin:0 auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 4px 12px}.head h1{font-size:clamp(19px,5vw,28px);letter-spacing:.02em;margin:0;text-shadow:2px 2px #0b231c}.subtitle{color:#c4d6b8;font-size:12px;margin:3px 0 0}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #fff;outline-offset:3px}

@media(max-width:410px){.area{top:46px;max-width:66%;left:9px;transform:none}.minimap{width:75px;height:104px}.mapBtn{top:119px}.guide{font-size:11px}.tip{font-size:12px}.dpad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px)}.reset{font-size:11px}}
</style>

<body>
<main class="shell">
 <header class="head"><div><h1>🌲 Lage i Rimforsa</h1><p class="subtitle">Ett litet 16-bitars promenadäventyr</p></div><button class="smallBtn" id="showMap">🗺️ Karta</button></header>
 <section class="game-frame" aria-label="Spelplan: utforska Rimforsa till fots">
  <canvas id="world" width="384" height="280" aria-label="Karta över Rimforsa där Lage går omkring"></canvas>
  <div class="hud">LAGE <span class="heart">♥♥♥</span></div><div class="area" id="area">Rimforsa</div>
  <canvas id="mini" class="minimap" width="84" height="112" aria-label="Minikarta över Rimforsa" role="img"></canvas>
  <button class="mapBtn" id="miniMapBtn">STOR KARTA</button>
  <div id="mapOverlay" role="dialog" aria-modal="true" aria-label="Karta över Rimforsa"><button class="smallBtn" id="closeMap">Stäng ✕</button><canvas id="wholeMap" width="480" height="800" aria-label="Översikt av hela spelkartan"></canvas></div>
 </section>
 <div class="tip"><span id="message"><strong>Nu börjar äventyret!</strong> Använd pilarna för att upptäcka Rimforsa.</span><button id="interact" class="action" hidden>Utforska ✨</button></div>
 <div class="controls"><div class="guide">Gå med pilarna, WASD eller tryck på en plats i spelvärlden.</div><div class="dpad" aria-label="Styr Lage"><button data-dir="up" aria-label="Gå uppåt">▲</button><button data-dir="left" aria-label="Gå åt vänster">◀</button><button data-dir="down" aria-label="Gå nedåt">▼</button><button data-dir="right" aria-label="Gå åt höger">▶</button></div><button class="reset" id="reset">Börja om ↺</button></div>
 <div class="footer">En lekfull, förenklad karta inspirerad av verkliga Rimforsa – inte en exakt vägkarta.</div>
</main>
<script>
(()=>{'use strict';
const W=960,H=1600;const c=document.getElementById('world'),ctx=c.getContext('2d');const mini=document.getElementById('mini'),mc=mini.getContext('2d');const whole=document.getElementById('wholeMap'),wc=whole.getContext('2d');const msg=document.getElementById('message'),area=document.getElementById('area'),interact=document.getElementById('interact');ctx.imageSmoothingEnabled=false;mc.imageSmoothingEnabled=false;wc.imageSmoothingEnabled=false;

// Deterministic retro grass tiles.
g.fillStyle='#75ad59';g.fillRect(0,0,W,H);for(let y=0;y<H;y+=16)for(let x=0;x<W;x+=16){const q=rnd();tile(x,y,16,q<.18?'#72a855':q<.42?'#7ab15e':q<.70?'#78ad57':'#82b960');if(rnd()<.25){tile(x+4,y+6,3,'#95c66c');tile(x+10,y+9,2,'#56934b')}}

for(let i=0;i<800;i++){let x=rand(0,W),y=rand(0,H);if(water(x,y)){g.fillStyle=rnd()<.5?'#307ca5':'#3d93b7';g.fillRect(x,y,rand(3,13),2)}}
// Stone and dirt tracks: approximate the screenshot's roads.
function road(points,width,kind='dirt'){g.lineCap='square';g.lineJoin='round';g.beginPath();g.moveTo(...points[0]);points.slice(1).forEach(p=>g.lineTo(...p));g.lineWidth=width+6;g.strokeStyle=kind==='main'?'#647167':'#6c864c';g.stroke();g.lineWidth=width;g.strokeStyle=kind==='main'?'#999994':kind==='town'?'#cbba8b':'#d1bc7c';g.stroke();if(kind==='main'){g.setLineDash([14,23]);g.strokeStyle='#ede1a4';g.lineWidth=2;g.stroke();g.setLineDash([])}}
const mainRoad=[[344,0],[338,300],[340,560],[330,770],[297,980],[265,1180],[211,1600]];road(mainRoad,30,'main');
const roads=[[[0,626],[105,642],[232,675],[332,760],[458,772],[645,692],[857,675]],[[0,954],[141,945],[295,977],[432,1008],[626,1016],[900,1000]],[[310,1180],[460,1133],[593,1117],[744,1100]],[[400,790],[412,934],[403,1137],[392,1410]],[[590,753],[620,883],[620,1050],[597,1247],[520,1480]],[[745,697],[740,882],[740,1114],[692,1350]],[[0,1224],[145,1218],[260,1252],[420,1332],[602,1359],[755,1330]],[[475,1050],[556,1074],[708,1085]],[[390,1482],[530,1510],[708,1500]],[[97,725],[105,875],[144,993]],[[470,632],[535,598],[605,591]],[[815,812],[870,858],[930,938]]];for(const r of roads)road(r,17,'town');
for(const r of [[[112,618],[120,740],[185,816]],[[102,520],[178,575],[258,620]],[[502,574],[612,538],[728,521]],[[784,1190],[850,1230]],[[784,1410],[822,1490]]])road(r,10);
// Forest clusters: trees do not block paths; walking is an exploration game.

for(let i=0;i<440;i++){let x=rand(0,W),y=rand(0,H);let forest=(x<230&&y<620)||(x<110&&y>950)||(x>620&&y<370)||(y>1480&&x<650)||(x>790&&y>1070);if(!forest||water(x,y))continue;if(Math.abs(x-335)<45&&y<850)continue;tree(x,y,rand(.68,1.45))}
// Gardens and buildings around the village.
function house(x,y,size=34,roof='#c76a3f'){if(water(x,y))return;g.fillStyle='#466d42';g.fillRect(x-size/2-4,y-size/2-4,size+8,size+8);g.fillStyle='#d9bd80';g.fillRect(x-size/2,y-size/2+6,size,size*.77);g.fillStyle='#a55132';g.fillRect(x-size/2-4,y-size/2,size+8,size*.44);g.fillStyle=roof;g.fillRect(x-size/2,y-size/2-3,size,size*.35);g.fillStyle='#f8e2b1';g.fillRect(x-size*.3,y+1,8,7);g.fillRect(x+size*.15,y+1,8,7);g.fillStyle='#598fa9';g.fillRect(x-size*.3+2,y+2,4,5);g.fillRect(x+size*.15+2,y+2,4,5);g.fillStyle='#805239';g.fillRect(x-3,y+size*.1,7,size*.4)}
for(let y=825;y<1508;y+=91){for(let x=370;x<795;x+=88){if(rnd()<.20||water(x,y)||Math.hypot(x-540,y-915)<92||Math.hypot(x-700,y-672)<80)continue;house(x+rand(-12,12),y+rand(-12,12),rand(31,43),rnd()<.4?'#b44b36':'#cb7444')}}
for(let i=0;i<28;i++){let x=rand(44,235),y=rand(820,1465);if(Math.abs(x-(340-y*.08))<45)continue;house(x,y,rand(27,39))}
for(let i=0;i<48;i++){let x=rand(0,W),y=rand(0,H);if(water(x,y))continue;g.fillStyle=rnd()<.5?'#f6d871':'#e9b2bb';g.fillRect(x,y,3,4);g.fillRect(x+6,y+3,2,2)}

// Public destinations represented as simplified in-game illustrations.
const spots=[
 {name:'Hem',x:104,y:620,text:'Här börjar Lages äventyr! Nu kan du upptäcka hela Rimforsa.',kind:'home'},
 {name:'Förskolan',x:695,y:700,text:'Här finns förskolan och en lekplats med gungor och rutschkana.',kind:'school'},
 {name:'ICA Rimforsa',x:535,y:895,text:'Dags att handla något gott? Här ligger ICA i Rimforsa.',kind:'shop'},
 {name:'Rimforsa centrum',x:448,y:1050,text:'Nu är du mitt i Rimforsa! Utforska gatorna och husen.',kind:'center'},
 {name:'Liljeholmen',x:790,y:925,text:'Här ligger bostadsområdet Liljeholmen med små vägar och hus.',kind:'houses'},

];
for(const s of spots){if(s.kind==='school'||s.kind==='shop'||s.kind==='home'){house(s.x,s.y-5,s.kind==='home'?46:69,s.kind==='school'?'#a95038':'#d97c32')}else if(s.kind==='beach'){g.fillStyle='#edcf82';g.fillRect(s.x-20,s.y-15,44,25);g.fillStyle='#ffffff';g.fillRect(s.x-3,s.y-24,4,20);g.fillStyle='#ea685e';g.fillRect(s.x+1,s.y-25,12,7)}else if(s.kind==='center'){g.fillStyle='#c2b58c';g.fillRect(s.x-22,s.y-23,44,31);g.fillStyle='#6b5f57';g.fillRect(s.x-3,s.y-17,7,26)}else{house(s.x,s.y,49)}label(s.name.toUpperCase(),s.x,s.y-47)}
// A local road sign on Route 23.

// Pointer and keyboard controls.
const sprite=new Image();sprite.src='./lage-sprites.png';let available=false;sprite.onload=()=>{available=true};const state={x:120,y:721,dir:'down',phase:0,camX:0,camY:0,walked:0};const keys={up:false,down:false,left:false,right:false};let goto=null,shown=null,near=null;

start();
function stop(){goto=null;for(const k in keys)keys[k]=false;document.querySelectorAll('[data-dir]').forEach(b=>b.classList.remove('held'))}
document.querySelectorAll('[data-dir]').forEach(b=>{const d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();stop();keys[d]=true;b.classList.add('held');b.setPointerCapture(e.pointerId)});for(const type of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,()=>{keys[d]=false;b.classList.remove('held')})});
const lookup={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right',W:'up',A:'left',S:'down',D:'right'};
window.addEventListener('keydown',e=>{if(document.getElementById('mapOverlay').classList.contains('show')){if(e.key==='Escape')closeMap();return}const d=lookup[e.key];if(!d)return;e.preventDefault();goto=null;keys[d]=true});window.addEventListener('keyup',e=>{const d=lookup[e.key];if(d)keys[d]=false});window.addEventListener('blur',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
function resize(){const box=c.getBoundingClientRect();const ratio=Math.min(1,450/Math.max(1,box.width));c.width=Math.max(240,Math.round(box.width*ratio));c.height=Math.max(210,Math.round(box.height*ratio));ctx.imageSmoothingEnabled=false}resize();window.addEventListener('resize',resize);

function currentSpot(){let chosen=null,dist=1e9;for(const s of spots){const d=Math.hypot(s.x-state.x,s.y-state.y);if(d<dist){dist=d;chosen=s}}return dist<88?chosen:null}
function refreshMessage(){const here=currentSpot();if(here?.name!==near?.name){shown=null;near=here;interact.hidden=!here;if(here){msg.innerHTML='<strong>'+here.name+'</strong> – tryck på Utforska för att titta närmare.';area.textContent=here.name}else{msg.innerHTML='<strong>På upptäcktsfärd!</strong> Fortsätt gå runt i Rimforsa.';area.textContent='Rimforsa'}}}

function drawPlayer(){const x=Math.round(state.x-(state.camX-c.width/2)),y=Math.round(state.y-(state.camY-c.height/2));ctx.fillStyle='#1d352844';ctx.beginPath();ctx.ellipse(x,y-2,12,5,0,0,Math.PI*2);ctx.fill();if(available){const row=state.dir==='down'?0:state.dir==='left'?1:state.dir==='right'?2:3;const frame=Math.floor(state.phase)%4;ctx.drawImage(sprite,frame*56,row*56,56,56,x-23,y-49,46,46)}else{ctx.fillStyle='#a2713e';ctx.fillRect(x-9,y-32,18,12);ctx.fillStyle='#f2ca9f';ctx.fillRect(x-8,y-27,16,13);ctx.fillStyle='#fcf1ca';ctx.fillRect(x-11,y-15,22,16);ctx.fillStyle='#9c4551';ctx.fillRect(x-9,y,7,8);ctx.fillRect(x+3,y,7,8)}}

let last=performance.now();function tick(now){const dt=Math.min((now-last)/1000,.045);last=now;let dx=(+keys.right)-(+keys.left),dy=(+keys.down)-(+keys.up);if(dx||dy)goto=null;else if(goto){dx=goto.x-state.x;dy=goto.y-state.y;if(Math.hypot(dx,dy)<6){goto=null;dx=dy=0}}const mag=Math.hypot(dx,dy);if(mag>.01){dx/=mag;dy/=mag;const speed=152*dt;let nx=Math.max(14,Math.min(W-14,state.x+dx*speed)),ny=Math.max(14,Math.min(H-14,state.y+dy*speed));if(!water(nx,ny)){state.x=nx;state.y=ny}else{if(!water(nx,state.y))state.x=nx;if(!water(state.x,ny))state.y=ny;if(goto)goto=null}state.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');state.phase+=dt*8;state.walked+=dt;if(state.walked>.16){refreshMessage();state.walked=0}}else state.phase=0;state.camX+=(state.x-state.camX)*Math.min(1,dt*13);state.camY+=(state.y-state.camY)*Math.min(1,dt*13);draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
const mapOverlay=document.getElementById('mapOverlay');function openMap(){stop();mapOverlay.classList.add('show');wc.drawImage(map,0,0,whole.width,whole.height);wc.fillStyle='#ffdc6c';wc.fillRect(state.x/W*whole.width-5,state.y/H*whole.height-5,10,10);wc.strokeStyle='#6c2826';wc.lineWidth=2;wc.strokeRect(state.x/W*whole.width-5,state.y/H*whole.height-5,10,10);document.getElementById('closeMap').focus()};function closeMap(){mapOverlay.classList.remove('show')};document.getElementById('showMap').addEventListener('click',openMap);document.getElementById('miniMapBtn').addEventListener('click',openMap);document.getElementById('closeMap').addEventListener('click',closeMap);mini.addEventListener('click',openMap);mapOverlay.addEventListener('click',e=>{if(e.target===mapOverlay)closeMap()});
