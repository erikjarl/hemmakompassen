<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Rimforsaäventyret</title><style>body{margin:0;background:#102e25;color:white;font-family:system-ui;text-align:center}h1{font-size:24px;margin:12px}p{margin:8px}canvas{display:block;margin:auto;width:min(96vw,600px);aspect-ratio:3/2;border:4px solid #d6ae61;border-radius:14px;touch-action:none;background:#71aa68}.pad{display:grid;grid-template-columns:repeat(3,75px);gap:5px;justify-content:center;margin:14px}.pad button{font-size:32px;height:65px;border:0;border-radius:15px;background:#f1d17d;touch-action:none}.pad button:active{background:#fff}#msg{font-weight:bold;color:#ffe27d;min-height:25px}button.restart{padding:10px;border-radius:12px;font-size:18px}</style></head><body><h1>🚗 Rimforsaäventyret 🐉</h1><p>Hitta alla fem stjärnor innan draken tar dem!</p><div id="msg">Stjärnor: 0 av 5</div><canvas id="game" width="600" height="400"></canvas><div class="pad"><span></span><button data-dir="up">⬆️</button><span></span><button data-dir="left">⬅️</button><button data-dir="down">⬇️</button><button data-dir="right">➡️</button></div><button class="restart" onclick="reset()">Spela igen 🔄</button><script>const c=document.getElementById('game'),g=c.getContext('2d'),msg=document.getElementById('msg');let car,stars,dragon,won,keys={};function reset(){car={x:75,y:315};stars=[{x:95,y:65},{x:280,y:80},{x:510,y:85},{x:490,y:310},{x:275,y:310}];dragon={x:490,y:165,t:0};won=false;msg.textContent='Stjärnor: 0 av 5'}reset();document.querySelectorAll('[data-dir]').forEach(b=>{const d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[d]=true;b.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[d]=false)});addEventListener('keydown',e=>{let d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d){e.preventDefault();keys[d]=true}});addEventListener('keyup',e=>{let d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d)keys[d]=false});function emoji(t,x,y,s=35){g.font=s+'px serif';g.textAlign='center';g.fillText(t,x,y)}function draw(){g.fillStyle='#85b96d';g.fillRect(0,0,600,400);g.fillStyle='#4c9ac1';g.fillRect(0,195,600,48);g.fillStyle='#d5c9a4';g.fillRect(30,0,90,400);g.fillRect(0,265,600,65);g.fillStyle='#fff3bf';for(let y=10;y<400;y+=48)g.fillRect(73,y,5,23);for(let x=20;x<600;x+=50)g.fillRect(x,295,27,4);emoji('🏠',170,120,65);emoji('🏡',390,135,60);emoji('🌳',230,195,45);emoji('🌲',550,185,48);emoji('🌲',340,380,45);emoji('🚤',425,233,36);emoji('🚁',525,40,36);for(const s of stars)emoji('⭐',s.x,s.y,32);emoji('🐉',dragon.x,dragon.y,58);emoji('🚗',car.x,car.y,43);if(won){g.fillStyle='#173d30dd';g.fillRect(65,135,470,110);g.fillStyle='white';g.textAlign='center';g.font='bold 30px system-ui';g.fillText('🎉 Du räddade Rimforsa!',300,197)}}let last=performance.now();function frame(now){let dt=Math.min((now-last)/16.7,2);last=now;if(!won){let dx=(+!!keys.right)-(+!!keys.left),dy=(+!!keys.down)-(+!!keys.up);let mag=Math.hypot(dx,dy)||1;car.x=Math.max(22,Math.min(578,car.x+dx/mag*3.1*dt));car.y=Math.max(38,Math.min(385,car.y+dy/mag*3.1*dt));dragon.t+=.022*dt;dragon.y=164+Math.sin(dragon.t)*18;stars=stars.filter(s=>Math.hypot(s.x-car.x,s.y-car.y)>30);msg.textContent='Stjärnor: '+(5-stars.length)+' av 5';if(!stars.length){won=true;msg.textContent='Du vann! Rimforsa är räddat! 🏆'}}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></body></html>
