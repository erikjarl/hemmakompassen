<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f3">
  <title>Hemmakompassen</title>
  <meta name="description" content="Hemmakompassen – en ny webbplats under uppbyggnad.">
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: #f4f6f3; color: #233a32; }
    main { max-width: 38rem; width: 100%; }
    .mark { width: 3.5rem; height: 3.5rem; display: grid; place-items: center; border: 1px solid #a4b8ad; border-radius: 50%; font-size: 2rem; margin-bottom: 2.5rem; }
    h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 600; letter-spacing: -.045em; line-height: 1.1; margin: 0 0 1rem; }
    p { font-size: 1.125rem; line-height: 1.6; color: #53685e; margin: 0; }
    footer { margin-top: 4rem; font-size: .875rem; color: #667a70; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">⌂</div>
    <h1>Hemmakompassen</h1>
    <p>En ny webbplats är på väg.</p>
    <footer>Under uppbyggnad</footer>
  </main>
</body>
</html>
